# Commodity products of bioelectrochemical reduction. One entry per product.
# Cathode potentials are formal potentials at pH 7 (V vs SHE) unless noted; metal
# potentials are for ~10 mM dissolved metal. Prices are 100 % basis; avoided GWP is
# cradle-to-gate of the conventional route. `verified` flags which values were
# traced to a primary source; the others are indicative market ranges and are swept.

hydrogen:
  label: Hydrogen
  phase: gas
  formula: H2
  M_g_per_mol: 2.016
  electrons: 2
  half_reaction: "2 H+ + 2 e- -> H2"
  E_cathode_V_SHE: -0.414
  price_usd_per_kg: 2.00
  avoided_gwp_kg_co2e_per_kg: 11.0
  cathode_type: ss_mesh
  co2_kg_per_kg_product: 0.0
  dsp: {route: gas, recovery: 0.90, electricity_kWh_per_kg: 2.0,
        capex_ref_usd: 150000.0, capex_ref_capacity_kg_per_h: 4.17, capex_exponent: 0.7,
        note: "compression to 30 bar + PSA to 99.97 %"}
  realistic: {cathode_kinetic_V: 0.20, coulombic_efficiency: 0.80}
  verified: {price: false, gwp: false}
  source: "price: US industrial grey H2 gate price 2024, $1.5-2.5/kg; GWP: SMR 9-12 kg/kg (IEA 2019)"

